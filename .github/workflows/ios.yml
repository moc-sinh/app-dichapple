name: iOS

on:
  push:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload to TestFlight"
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Typing tests
        run: |
          swiftc -O Keyboard/TelexCore/*.swift Keyboard/Composer.swift Tests/main.swift -o telex-tests
          ./telex-tests
          # VietTelex's 9,091 typing cases through the same composer.
          swiftc -O Keyboard/TelexCore/*.swift Keyboard/Composer.swift Tests/Suite/main.swift -o telex-suite
          ./telex-suite Tests/Suite/telex_suite.tsv
          # Key positions against Apple's keyboard.
          swiftc Keyboard/KeyMetrics.swift Tests/Keys/main.swift -o key-tests
          ./key-tests

      - name: Language detection tests
        run: |
          swiftc -O Shared/Config.swift Shared/SharedStore.swift Shared/History.swift Shared/LanguageDetector.swift \
            Tests/Language/main.swift -o language-tests
          ./language-tests

      # The Hội thoại tab's parts that need no microphone: sentence cutting, phantom text, echo,
      # live translation events, the speech services' forms.
      - name: Conversation tests
        run: |
          swiftc -O Shared/Config.swift Shared/SharedStore.swift Shared/History.swift Shared/LanguageDetector.swift \
            Shared/Translator.swift App/Conversation/PCM.swift App/Conversation/SpeechSegmenter.swift \
            App/Conversation/TranscriptFilter.swift App/Conversation/LiveTranslation.swift \
            App/Conversation/SpeechServices.swift Tests/Conversation/main.swift -o conversation-tests
          ./conversation-tests

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      # The build number is the run number, shown in the app as "1.1.0 (26)": the run's page has the IPA.
      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project MSTrans.xcodeproj -scheme MSTrans -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee build/xcodebuild.log | tail -40
          # The compiler's warnings for the app's own code, so none goes into a release unseen.
          echo "Warnings:"
          grep -E ": warning: " build/xcodebuild.log | grep -E "/(App|Keyboard|Shared)/" | sed "s|$PWD/||" | sort -u | head -80 || true

      # A free Apple ID can install this IPA with AltStore or SideStore, which re-sign it. Not Sideloadly or
      # Feather: on iOS 26 their re-signed keyboard lacks the main-binary flag and is killed at launch.
      # Ad-hoc signing here only embeds the App Group entitlements so they survive re-signing.
      - name: Package IPA
        run: |
          APP=build/ipa/Payload/MSTrans.app
          mkdir -p build/ipa/Payload
          cp -R build/dd/Build/Products/Release-iphoneos/MSTrans.app build/ipa/Payload/
          codesign -f -s - --entitlements Support/MSTransKeyboard.entitlements "$APP/PlugIns/MSTransKeyboard.appex"
          codesign -f -s - --entitlements Support/MSTrans.entitlements "$APP"
          (cd build/ipa && zip -qry ../MSTrans.ipa Payload)
          ls -lh build/MSTrans.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MSTrans-ipa
          path: build/MSTrans.ipa
          retention-days: 30

  # Opens the keyboard in the iOS Simulator; fails if it crashes or never starts.
  keyboard-smoke:
    runs-on: macos-15
    timeout-minutes: 34
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project MSTrans.xcodeproj -scheme MSTrans -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            ARCHS=arm64 CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= build | tail -20

      # The runners' simulators are sometimes slow to boot and launch apps (4-5 minutes for a
      # phase that usually takes 30 s): every check passed and the step still ran out of time.
      - name: Open the keyboard in the simulator
        # About 20 minutes, a few more when the typing benchmark is measured twice.
        timeout-minutes: 28
        run: bash ci/keyboard-smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keyboard-smoke
          path: build/smoke
          retention-days: 7

  testflight:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Thiếu secret $v (xem docs/HUONG-DAN.md)"; exit 1; fi
          done

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive and upload
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project MSTrans.xcodeproj -scheme MSTrans -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/MSTrans.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            "${AUTH[@]}" archive | tail -40
          sed "s/TEAM_ID_PLACEHOLDER/$TEAM_ID/" ExportOptions.plist > build/ExportOptions.plist
          xcodebuild -exportArchive -archivePath build/MSTrans.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            "${AUTH[@]}" | tail -40
