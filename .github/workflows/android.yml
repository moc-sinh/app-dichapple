name: Android

# Every push that touches the Android app: the core's tests (typing, translation, Hội thoại), then
# the APK, published as a GitHub release so the newest one always downloads from
# https://github.com/moc-sinh/app-dichapple/releases/latest/download/MSTrans.apk
on:
  push:
    paths:
      - "android/**"
      - "Tests/Suite/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    # 24.04 comes with the Android SDK installed.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # Gradle also fetches what is missing; this only makes it certain.
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null || echo "::warning::sdkmanager did not install android-35"
          echo "::notice title=Android SDK::$ANDROID_HOME: $(ls "$ANDROID_HOME/platforms" | tr '\n' ' ')"

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests
        run: |
          set -o pipefail
          ./gradlew :core:test --console=plain 2>&1 | tee core-test.log

      - name: Build APK
        env:
          # Each build gets a higher version code, so it installs over the one before.
          MSTRANS_BUILD: ${{ github.run_number }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --console=plain 2>&1 | tee build.log

      # The job's log is not always readable where the build is looked after: the errors also go
      # into the run's annotations.
      - name: Report the failure
        if: failure()
        run: |
          for f in core-test.log build.log; do
            [ -f "$f" ] || continue
            { grep -E "^e: |error:|ERROR|FAILED|What went wrong|Exception" -A4 "$f" || tail -n 40 "$f"; } | head -n 80 > errors.txt
            body=$(tail -c 6000 errors.txt | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$f::$body"
          done

      - name: Name the APK
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk MSTrans.apk
          ls -l MSTrans.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MSTrans-apk
          path: android/MSTrans.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-$VERSION-${{ github.run_number }}"
          gh release create "$TAG" MSTrans.apk \
            --target "$GITHUB_SHA" \
            --title "MSTrans Android $VERSION (bản ${{ github.run_number }})" \
            --notes "Bản Android build từ ${GITHUB_SHA::7} (nhánh ${GITHUB_REF_NAME}). Tải MSTrans.apk về điện thoại rồi mở để cài; lần đầu Android hỏi cho phép cài app từ trình duyệt hoặc trình quản lý tệp." \
            --latest
