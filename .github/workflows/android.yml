name: Android

# Every push that touches the Android app: the core's tests (typing, translation, Hội thoại), then
# the APK, the APK's checks (package, version code, signature, SHA-256) and Android Lint.
# Only the delivery branch publishes a public GitHub release, so the newest one always downloads from
# https://github.com/moc-sinh/app-dichapple/releases/latest/download/MSTrans.apk
# Any other branch (a test build) gets a DRAFT release instead: not public, only people with write
# access to the repository see it, and it never becomes "latest".
on:
  push:
    paths:
      - "android/**"
      - "Tests/Suite/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # The one branch whose builds are published for everyone.
  DELIVERY_BRANCH: claude/funny-gates-s6pl2c

jobs:
  build:
    # 24.04 comes with the Android SDK installed.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # Gradle also fetches what is missing; this only makes it certain.
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null || echo "::warning::sdkmanager did not install android-35"
          echo "::notice title=Android SDK::$ANDROID_HOME: $(ls "$ANDROID_HOME/platforms" | tr '\n' ' ')"

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests
        run: |
          set -o pipefail
          ./gradlew :core:test --console=plain 2>&1 | tee core-test.log

      - name: Build APK
        env:
          # Each build gets a higher version code, so it installs over the one before.
          MSTRANS_BUILD: ${{ github.run_number }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --console=plain 2>&1 | tee build.log

      # The job's log is not always readable where the build is looked after: the errors also go
      # into the run's annotations.
      - name: Report the failure
        if: failure()
        run: |
          for f in core-test.log build.log; do
            [ -f "$f" ] || continue
            { grep -E "^e: |error:|ERROR|FAILED|What went wrong|Exception" -A4 "$f" || tail -n 40 "$f"; } | head -n 80 > errors.txt
            body=$(tail -c 6000 errors.txt | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$f::$body"
          done

      - name: Name the APK
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk MSTrans.apk
          ls -l MSTrans.apk

      # What the phone will check before installing over the old version: the package name, a higher
      # version code, and the same signing certificate. Written as annotations (readable from anywhere).
      - name: Check the APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          BADGING=$("$BT/aapt2" dump badging MSTrans.apk | head -n 1)
          CERT=$("$BT/apksigner" verify --verbose --print-certs MSTrans.apk | grep -E "Verified using|certificate SHA-256|Number of signers" | tr '\n' ' ')
          SHA=$(sha256sum MSTrans.apk | cut -d' ' -f1)
          SIZE=$(stat -c %s MSTrans.apk)
          echo "::notice title=APK badging::$BADGING"
          echo "::notice title=APK signature::$CERT"
          echo "::notice title=APK sha256::$SHA ($SIZE bytes)"
          echo "$SHA  MSTrans.apk" > MSTrans.apk.sha256
          echo "$BADGING" | grep -q "name='vn.mocsinh.mstrans'" || { echo "::error::package name changed"; exit 1; }

      - name: Android Lint
        # Lint's findings are reported (annotations), not hidden; a lint crash does not hold back the APK.
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:lintRelease --console=plain 2>&1 | tail -n 5
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, glob
          files = glob.glob("app/build/reports/lint-results-release.xml")
          if not files:
              print("::warning title=Lint::no report"); raise SystemExit
          issues = ET.parse(files[0]).getroot().findall("issue")
          counts = {}
          for i in issues:
              counts[i.get("severity")] = counts.get(i.get("severity"), 0) + 1
          print(f"::notice title=Lint summary::{counts}")
          for i in issues:
              if i.get("severity") in ("Error", "Fatal"):
                  loc = i.find("location")
                  where = f"{loc.get('file','').split('/android/')[-1]}:{loc.get('line','')}" if loc is not None else ""
                  print(f"::error title=Lint {i.get('id')}::{where} {i.get('message')}")
          seen = {}
          for i in issues:
              if i.get("severity") == "Warning":
                  seen.setdefault(i.get("id"), 0); seen[i.get("id")] += 1
          print("::notice title=Lint warnings by id::" + ", ".join(f"{k}={v}" for k, v in sorted(seen.items())))
          PY

      # Only the delivery branch keeps a downloadable artifact; a test build goes to a draft release.
      - uses: actions/upload-artifact@v4
        if: github.ref_name == env.DELIVERY_BRANCH
        with:
          name: MSTrans-apk
          path: android/MSTrans.apk

      - name: Keep the test build private (draft release)
        if: github.ref_name != env.DELIVERY_BRANCH
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="test-android-$VERSION-${{ github.run_number }}"
          gh release create "$TAG" MSTrans.apk MSTrans.apk.sha256 \
            --draft --prerelease \
            --target "$GITHUB_SHA" \
            --title "Thử nghiệm MSTrans Android $VERSION (bản ${{ github.run_number }})" \
            --notes "Bản thử nghiệm, không công khai, từ ${GITHUB_SHA::7} (nhánh ${GITHUB_REF_NAME})."
          echo "::notice title=Draft release::$TAG"

      - name: Publish the release
        if: github.ref_name == env.DELIVERY_BRANCH
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-$VERSION-${{ github.run_number }}"
          gh release create "$TAG" MSTrans.apk \
            --target "$GITHUB_SHA" \
            --title "MSTrans Android $VERSION (bản ${{ github.run_number }})" \
            --notes "Bản Android build từ ${GITHUB_SHA::7} (nhánh ${GITHUB_REF_NAME}). Tải MSTrans.apk về điện thoại rồi mở để cài; lần đầu Android hỏi cho phép cài app từ trình duyệt hoặc trình quản lý tệp." \
            --latest
