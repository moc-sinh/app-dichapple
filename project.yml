# XcodeGen spec: `xcodegen generate` turns this into MSTrans.xcodeproj (no Mac needed to edit it).
# Bundle IDs and the App Group keep their first (com.mocsinh.dichapple) names, so a new build
# installs over the old one and keeps its settings.
# The App Group is also named in Shared/Config.swift (used when no provisioning profile is embedded).
name: MSTrans
options:
  bundleIdPrefix: com.mocsinh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.9.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      # Speed over size: every key runs Telex and the key handling on the main thread, and code
      # pages are read from the app, not counted in the keyboard's memory budget.
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      GCC_OPTIMIZATION_LEVEL: s
      STRIP_INSTALLED_PRODUCT: YES
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  MSTrans:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mocsinh.dichapple
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Support/MSTrans-Info.plist
      properties:
        CFBundleDisplayName: MSTrans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        # Hội thoại: the microphone hears the meeting, and keeps listening with the screen locked.
        NSMicrophoneUsageDescription: "MSTrans nghe cuộc họp, cuộc nói chuyện để dịch lời mọi người sang tiếng Việt, và nghe câu bạn nói khi bạn bấm Tôi nói để dịch sang tiếng đối tác."
        UIBackgroundModes: [audio]
    entitlements:
      path: Support/MSTrans.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mocsinh.dichapple]
    dependencies:
      - target: MSTransKeyboard
    scheme: {}

  # Translation keyboard. UIKit only: keyboards get a small memory budget.
  MSTransKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mocsinh.dichapple.keyboard
    info:
      path: Support/MSTransKeyboard-Info.plist
      properties:
        CFBundleDisplayName: MSTrans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 120 Hz iPhones may show a key's pop-up on the next 120 Hz frame instead of a 60 Hz one.
        CADisableMinimumFrameDurationOnPhone: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: vi-VN
            RequestsOpenAccess: true
    entitlements:
      path: Support/MSTransKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mocsinh.dichapple]
